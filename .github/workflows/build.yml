name: tests

# Runs the test suite on every change to the analysis code.
#
# This deliberately does not rebuild docs/data/index.json. The committed results
# are built from EIA-861 and EPA eGRID workbooks, which are large agency files
# that are not redistributable and so are not in the repo. A runner without them
# falls back to the synthetic sample, and committing that would quietly replace
# the real figures on the site with sample ones. The data file is refreshed
# locally instead, by running the pipeline with those files in data/raw.
on:
  push:
    branches: [main]
    paths:
      - "grid/**"
      - "analysis/**"
      - "tests/**"
      - "pipeline.py"
      - "server.py"
      - "config.yaml"
      - "requirements.txt"
      - "requirements-api.txt"
      # Also validate when the committed results or the site data change, so a
      # hand refresh that drifts or corrupts them is caught before it lands.
      - "outputs/**"
      - "docs/data/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt pytest

      - name: Run tests
        run: pytest -q

      # Validate the committed figures BEFORE the pipeline smoke test below
      # overwrites outputs/ with sample data in the runner. This checks that the
      # published results table and the site JSON are in range, agree with each
      # other, and reproduce from their components (i.e. are computed, not edited).
      - name: Validate published data
        run: python analysis/validate_data.py

      - name: Check the pipeline runs end to end on the sample
        run: python pipeline.py

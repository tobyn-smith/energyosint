name: refresh data

# Rebuilds the committed results and the site JSON, and only commits them
# when the run actually used real capacity and reliability figures. A run
# without them falls back to the sample, which must never land on top of
# the real numbers (see the note in build.yml), so this skips instead.
#
# The workbooks are large and not mine to redistribute, so you pass them in:
#   - EIA_API_KEY (repo secret)            -> live plant capacity via the EIA API
#   - reliability_url / plants_url          -> the EIA-861 zip and EPA eGRID workbook
#     (dispatch inputs, or the repo variables RELIABILITY_URL / PLANTS_URL for the
#     scheduled run)
# With none of these present the scheduled run does nothing useful: it
# rebuilds on the sample, sees that, and commits nothing.

on:
  workflow_dispatch:
    inputs:
      reliability_url:
        description: "URL to the EIA-861 annual zip (f861YYYY.zip) or Reliability_YYYY.xlsx"
        required: false
        default: ""
      plants_url:
        description: "URL to the EPA eGRID workbook (egridYYYY.xlsx)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt
          # geopandas is optional; without it the map is left as is
          pip install geopandas || echo "geopandas unavailable; the map will be left as is"

      - name: Download the real workbooks if we have urls
        env:
          RELIABILITY_URL: ${{ github.event.inputs.reliability_url || vars.RELIABILITY_URL }}
          PLANTS_URL: ${{ github.event.inputs.plants_url || vars.PLANTS_URL }}
        run: |
          mkdir -p data/raw
          if [ -n "$RELIABILITY_URL" ]; then
            echo "downloading EIA-861 reliability workbook"
            curl -fsSL "$RELIABILITY_URL" -o data/raw/f8612023.zip
          fi
          if [ -n "$PLANTS_URL" ]; then
            echo "downloading EPA eGRID workbook"
            curl -fsSL "$PLANTS_URL" -o data/raw/egrid2023.xlsx
          fi

      - name: Rebuild
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python pipeline.py

      - name: Refuse to publish sample data
        id: gate
        run: |
          python - <<'PY'
          import os
          from grid import store
          conn = store.connect("outputs/index.db")
          src = store.list_runs(conn).iloc[0]["source"]
          print("provenance:", src)
          synthetic = [p for p in ("capacity=synthetic", "reliability=synthetic") if p in src]
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"real={'false' if synthetic else 'true'}\n")
          if synthetic:
              print("capacity and/or reliability came from the sample; nothing will be published.")
          else:
              print("capacity and reliability are real; refreshing the derived artifacts.")
          PY

      - name: Refresh the findings and the other derived files
        if: steps.gate.outputs.real == 'true'
        run: |
          python analysis/report.py
          python analysis/weight_sensitivity.py
          python analysis/regional_summary.py
          python analysis/component_overlap.py

      - name: Check the rebuilt figures still add up
        if: steps.gate.outputs.real == 'true'
        run: python analysis/validate_data.py

      - name: Commit if anything changed
        if: steps.gate.outputs.real == 'true'
        run: |
          git config user.name "Tobyn Smith"
          git config user.email "298003421+tobyn-smith@users.noreply.github.com"
          git add outputs docs/data/index.json
          if git diff --cached --quiet; then
            echo "the published figures are already up to date"
          else
            git commit -m "refresh the published figures"
            git push
          fi

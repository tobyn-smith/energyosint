name: rebuild site data

# Re-run the pipeline whenever the analysis code changes and commit the refreshed
# data file the web deck reads. The commit only touches docs/data, which is not in
# the trigger paths below, so it does not set the workflow off again.
on:
  push:
    branches: [main]
    paths:
      - "grid/**"
      - "analysis/**"
      - "pipeline.py"
      - "config.yaml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-site-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt pytest

      - name: Run tests
        run: pytest -q

      - name: Rebuild data
        run: python pipeline.py

      - name: Commit refreshed site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/index.json
          if git diff --cached --quiet; then
            echo "site data unchanged"
          else
            git commit -m "rebuild site data [skip ci]"
            git push
          fi
